# PhotoRAW — docker compose deployment
#
#   cp .env.example .env      # fill in API keys, passwords, S3 credentials
#   docker compose up -d --build
#
# Services:
#   db      PostgreSQL — shared work-queue / albums / users metadata store
#   webui   review UI + customer share links + render jobs   -> http://host:8765
#   worker  inbox watcher + AI analysis + develop/retouch (drop RAWs in ./inbox)
#   minio   optional S3-compatible storage for self-contained deployments:
#           docker compose --profile local-s3 up -d
#           (point S3_ENDPOINT_URL=http://minio:9000 in .env)
#
# webui and worker share the /data volume (local file cache) and the /models volume
# (rembg weights), and both talk to the `db` Postgres service for metadata. With
# PIPELINE_STORAGE=s3 every durable artifact (RAW archive, previews, outputs, thumbs,
# masks) is mirrored to the S3 service, so the data volume is a rebuildable cache and
# Postgres + the bucket are the source of truth. To use SQLite instead (single-node),
# set PIPELINE_DATABASE_URL= (empty) in .env and the DB falls back to /data/pipeline.db.

services:
  # App database (work queue / albums / users metadata). Opt-in: enable with the
  # `postgres` profile AND set PIPELINE_DATABASE_URL (see below). Without it the app
  # uses a SQLite file on the data volume — no Postgres container needed.
  #   docker compose --profile postgres up -d
  db:
    profiles: ["postgres"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-photoraw}
      POSTGRES_USER: ${DB_USER:-photoraw}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-photoraw}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-photoraw} -d ${DB_NAME:-photoraw}"]
      interval: 10s
      timeout: 5s
      retries: 5

  webui:
    build: .
    image: photoraw:latest
    restart: unless-stopped
    command: python -m pipeline.webui --host 0.0.0.0
    env_file: .env
    # DB backend comes from PIPELINE_DATABASE_URL in .env: empty/unset -> SQLite file on
    # the data volume; a postgresql:// URL -> Postgres (also enable the `postgres` profile).
    ports:
      - "${WEBUI_PORT:-8765}:8765"
    volumes:
      - data:/data
      - models:/models
    depends_on:
      db:
        condition: service_healthy
        required: false      # only waits when the `postgres` profile brings db up
    healthcheck:
      # /api/me is always public (returns 200 even when Keycloak auth is required);
      # /api/defaults needs a session once auth is on, so it can't be the health probe
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8765/api/me')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: .
    image: photoraw:latest
    restart: unless-stopped
    command: python -m pipeline.run --wb camera
    env_file: .env
    volumes:
      - data:/data
      - models:/models
      # drop RAW files here from the host; the watcher picks them up
      - ${INBOX_DIR:-./inbox}:/data/inbox
    depends_on:
      db:
        condition: service_healthy
        required: false      # only waits when the `postgres` profile brings db up

  # --- optional: self-hosted auth (Keycloak + its Postgres) ----------------
  # Multi-user login with roles (super_admin / editor) and the in-app Users panel.
  # Skip this profile to run open / single-password, or point KEYCLOAK_URL at an
  # external Keycloak. First run imports keycloak/realm-photoraw.json — edit its two
  # CHANGE-ME placeholders (client secret + initial admin password) to match .env.
  #   docker compose --profile auth up -d
  keycloak:
    profiles: ["auth"]
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: start --import-realm --hostname-strict=false --http-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN:-kcadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?set KC_ADMIN_PASSWORD in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://kc-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?set KC_DB_PASSWORD in .env}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      kc-postgres:
        condition: service_healthy

  kc-postgres:
    profiles: ["auth"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?set KC_DB_PASSWORD in .env}
    volumes:
      - kc-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- optional: self-hosted S3 (MinIO) ------------------------------------
  # Skip this profile when using an external S3 service (AWS, R2, B2, Spaces…).
  minio:
    profiles: ["local-s3"]
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # only used when the `local-s3` profile is active; set real values in .env then
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-photoraw}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-changeme-min-io}
    ports:
      - "9000:9000"    # S3 API
      - "9001:9001"    # web console
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  minio-init:
    profiles: ["local-s3"]
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_USER $$MINIO_PASS &&
      mc mb --ignore-existing local/$$BUCKET &&
      echo 'bucket ready: '$$BUCKET"
    environment:
      MINIO_USER: ${S3_ACCESS_KEY}
      MINIO_PASS: ${S3_SECRET_KEY}
      BUCKET: ${S3_BUCKET:-photoraw}

volumes:
  data:
  models:
  minio:
  kc-db:
  pg-data:
