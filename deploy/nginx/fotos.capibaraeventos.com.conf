# PhotoRAW — reverse proxy for fotos.capibaraeventos.com (HTTP only)
#
# Install:
#   sudo cp fotos.capibaraeventos.com.conf /etc/nginx/sites-available/fotos.capibaraeventos.com
#   sudo ln -s /etc/nginx/sites-available/fotos.capibaraeventos.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTP only (no TLS): X-Forwarded-Proto is $scheme ("http"), so the app leaves session
# cookies non-Secure and login works over plain HTTP. When you add TLS here later, the
# same header flips to "https" automatically and cookies become Secure — no app change.

upstream photo-capibara {
    server 127.0.0.1:8765;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name fotos.capibaraeventos.com;

    # RAW uploads (PIPELINE_MAX_UPLOAD_MB defaults to 200 MB); leave headroom
    client_max_body_size 300m;

    # long renders and large ZIP / full-res original downloads
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # stream big uploads straight to the app instead of buffering them to disk first
    proxy_request_buffering off;

    access_log /var/log/nginx/fotos.capibaraeventos.com.access.log;
    error_log  /var/log/nginx/fotos.capibaraeventos.com.error.log;

    location / {
        proxy_pass http://photo-capibara;
        proxy_http_version 1.1;
        proxy_set_header Connection "";           # reuse upstream keepalive connections

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # "http" now; "https" once TLS is added
        proxy_set_header X-Forwarded-Host  $host;
    }
}
